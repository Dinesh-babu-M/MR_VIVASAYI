# Netlify Configuration for MR. VIVASAYI Single Page Application (SPA)
[build]
  command = "npm run build"
  publish = "dist"

# Redirect all client-side routes (e.g. /admin/login, /products, /orders) to /index.html with status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for fast global CDN delivery
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
